spring.application.name=helpdesk-backend

spring.datasource.url=jdbc:mysql://localhost:3307/helpdesk
spring.datasource.username=helpdesk_user
spring.datasource.password=helpdesk_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT development configuration.
# Override this value through the JWT_SECRET environment variable outside development.
app.jwt.secret=${JWT_SECRET:change-this-development-jwt-secret-key-before-production-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Creates and resets the three development accounts listed below.
# Disable this in production.
app.auth.seed-enabled=${HELPDESK_SEED_ENABLED:true}
app.auth.seed-password=${HELPDESK_SEED_PASSWORD:Helpdesk123!}